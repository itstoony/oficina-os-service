apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-app
  namespace: oficina
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: os-app
  template:
    metadata:
      labels:
        app: os-app
    spec:
      containers:
        - name: os-service
          image: itstoony/os-service:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: os-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: os-secrets
                  key: db-password
            - name: OFICINA_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: os-secrets
                  key: jwt-secret
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: os-secrets
                  key: rabbitmq-password
            - name: SPRING_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: os-secrets
                  key: mail-password
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: os-app
  namespace: oficina
spec:
  selector:
    app: os-app
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-db
  namespace: oficina
spec:
  replicas: 1
  selector:
    matchLabels:
      app: os-db
  template:
    metadata:
      labels:
        app: os-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: os_service
            - name: POSTGRES_USER
              value: os_service
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: os-secrets
                  key: db-password
          ports:
            - containerPort: 5432
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: db-data
      volumes:
        - name: db-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: os-db
  namespace: oficina
spec:
  selector:
    app: os-db
  ports:
    - port: 5432
      targetPort: 5432
