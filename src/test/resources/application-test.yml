spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  rabbitmq:
    host: localhost
    port: 5672

oficina:
  jwt:
    secret: chave-de-teste-com-pelo-menos-32-caracteres-ok
    expiracao: 86400000
  seguranca:
    bcrypt-strength: 4
    cors:
      allowed-origins: http://localhost:3000
